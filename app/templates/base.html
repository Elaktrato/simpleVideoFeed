<!doctype html>
<html lang="en" data-open-video="{{ open_video or '' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1b26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}Feed{% endblock %} · simpleVideoFeed</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="preload" href="/static/fonts/geist-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/static/js/nav.js" defer></script>
  <script src="/static/js/player.js" defer></script>
  <script src="/static/js/feed.js" defer></script>
</head>
<body>
  {% include "_icons.html" %}
  <main id="main" data-title="{{ self.title() | striptags | trim }}">
    {% block content %}{% endblock %}
  </main>
  <div id="player" hidden>
    <video id="video" playsinline preload="metadata"></video>
  </div>
  <div id="toast" class="toast" hidden></div>
</body>
</html>
