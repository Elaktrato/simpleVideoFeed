{% extends "base.html" %}
{% block title %}Queue{% endblock %}
{% block content %}
<div class="player" id="qplayer-wrap" {% if not items %}hidden{% endif %}>
  <video id="qplayer" controls playsinline preload="metadata"></video>
</div>
<div id="qnow" class="vtitle"></div>
<ul class="queue" id="queue-list">
  {% for v in items %}
  <li class="qitem" data-id="{{ v.id }}">
    <span class="qtitle">{{ v.title }}<small>{{ v.channel_title }}{% if not v.file_path %} · downloading…{% endif %}</small></span>
    <span class="qbtns">
      <button class="btn icon" data-action="up" data-id="{{ v.id }}" aria-label="Move up">↑</button>
      <button class="btn icon" data-action="down" data-id="{{ v.id }}" aria-label="Move down">↓</button>
      <button class="btn icon" data-action="remove" data-id="{{ v.id }}" aria-label="Remove">✕</button>
    </span>
  </li>
  {% endfor %}
</ul>
<p class="empty" id="queue-empty" {% if items %}hidden{% endif %}>Queue finished.</p>
{% endblock %}
